<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoteMe – Authentification</title>

  <!-- Police Google-like -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #3b82f6);
      overflow: hidden;
    }

    .background-blur {
      position: absolute;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%);
      filter: blur(90px);
      top: -120px;
      right: -120px;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 2;
      width: 380px;
      padding: 32px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo {
      width: 70px;
      margin-bottom: 10px;
    }

    .title {
      font-size: 2rem;
      font-weight: 600;
      color: white;
    }

    .subtitle {
      color: #dbeafe;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.1);
      padding: 4px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: #cbd5e1;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 500;
    }

    .tab.active {
      background: white;
      color: #1e3a8a;
    }

    .form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .form.active {
      display: flex;
    }

    .form input {
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.8);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }

    .form input:focus {
      background: white;
      box-shadow: 0 0 0 2px #3b82f6;
    }

    .btn {
      margin-top: 8px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .message {
      min-height: 18px;
      font-size: 0.85rem;
      color: white;
    }
  </style>
</head>

<body>

  <div class="background-blur"></div>

  <div class="auth-container">
    <img src="image/logo.png" class="auth-logo" />

    <h1 class="title">NoteMe</h1>
    <p class="subtitle">Connexion & Inscription</p>

    <div class="tabs">
      <button class="tab active" data-tab="login">Connexion</button>
      <button class="tab" data-tab="signup">Inscription</button>
    </div>

    <!-- Connexion -->
    <form id="login-form" class="form active">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Mot de passe" required />
      <button type="submit" class="btn">Se connecter</button>
      <p id="login-message" class="message"></p>
    </form>

    <!-- Inscription -->
    <form id="signup-form" class="form">
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Mot de passe (min 6 caractères)" required />
      <button type="submit" class="btn">Créer un compte</button>
      <p id="signup-message" class="message"></p>
    </form>
  </div>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://aotjudziaqyswxdruzhn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XmDNK7nzK1BC8uOg16HIMg_XfsRwKyz";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Tabs
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".form").forEach(f => f.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(`${btn.dataset.tab}-form`).classList.add("active");
      });
    });

    // Connexion
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const msg = document.getElementById("login-message");

      msg.textContent = "Connexion...";
      msg.style.color = "#fff";

      const { error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        msg.textContent = error.message;
        msg.style.color = "#ff6b6b";
      } else {
        msg.textContent = "Connecté !";
        msg.style.color = "#4ade80";
        setTimeout(() => (window.location.href = "index.html"), 700);
      }
    });

    // Inscription
    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("signup-email").value;
      const password = document.getElementById("signup-password").value;
      const msg = document.getElementById("signup-message");

      msg.textContent = "Création du compte...";
      msg.style.color = "#fff";

      const { error } = await client.auth.signUp({ email, password });

      if (error) {
        msg.textContent = error.message;
        msg.style.color = "#ff6b6b";
      } else {
        msg.textContent = "Compte créé ! Vérifie ton email.";
        msg.style.color = "#4ade80";
      }
    });
  </script>

</body>
</html>
